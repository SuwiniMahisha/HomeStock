name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # SonarQube Analysis Step
      - uses: SonarSource/sonarqube-scan-action@v5
        with:
          sonar-project-key: home-stock
          sonar-project-name: HomeStock
          sonar-host-url: http://localhost:9000 # Use secrets for security
          sonar-login: sqa_ef3f8b7083ed5ccf5eede7e453a9cd61363dc0c9 # Use secrets for security
